name: Companion V1 responsive commercial workspace
on:
  push:
    branches: [main, codex/stock-watches, codex/commercial-ux-audit]
    paths:
      - 'validation-v12/**'
      - 'tests/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - '.github/workflows/strategy-preview-smoke.yml'
permissions:
  contents: read
jobs:
  strategy-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check preview module syntax
        run: |
          node --check validation-v12/assets/app-crm-d24.js
          node --check validation-v12/assets/app-crm-d25.js
          node --check validation-v12/assets/app-crm-d26.js
          node --check validation-v12/assets/odoo-quote-pipeline-d26.mjs
          node --check validation-v12/assets/odoo-quote-pipeline-d27.mjs
          node --check validation-v12/assets/odoo-quote-pipeline-d28.mjs
          node --check validation-v12/assets/app-crm-d28.js
          node --check validation-v12/assets/app-crm-d30.js
          node --check validation-v12/assets/odoo-quote-pipeline-d30.mjs
          node --check validation-v12/assets/odoo-commission-model-d30.mjs
          node --check validation-v12/assets/commission-scenario-d30.mjs
          node --check validation-v12/assets/commission-scenario-ui-d30.mjs
          node --check validation-v12/assets/order-line-commission-d30.mjs
          node --check validation-v12/assets/kino-unit-basis-d30.mjs
          node --check validation-v12/assets/kino-calculation-d31.mjs
          node --check validation-v12/assets/commission-audit-d31.mjs
          node --check validation-v12/assets/odoo-invoice-evidence-d32.mjs
          node --check validation-v12/assets/commission-review-d33.mjs
          node --check validation-v12/assets/odoo-links-d33.mjs
          node --check validation-v12/assets/source-state-d34.mjs
          node --check validation-v12/assets/connector-status-model-d34.mjs
          node --check validation-v12/assets/connectors-d34.mjs
          node --check validation-v12/assets/stock-model-d34.mjs
          node --check validation-v12/assets/stocks-d34.mjs
          node --check validation-v12/assets/archive-model-d35.mjs
          node --check validation-v12/assets/archives-d35.mjs
          node --check validation-v12/assets/task-model-d36.mjs
          node --check validation-v12/assets/tasks-d36.mjs
          node --check validation-v12/assets/commission-rules-d37.mjs
          node --check validation-v12/assets/commission-returns-d37.mjs
          node --check validation-v12/assets/monthly-credit-model-d38.mjs
          node --check validation-v12/assets/monthly-credits-d38.mjs
          node --check validation-v12/assets/product-match-v1.mjs
          node --check validation-v12/assets/v1-interface.mjs
          node --check tests/companion-v1-preview.mjs
          node --check supabase/functions/odoo-monthly-credits/core.mjs
          node --check tests/monthly-credits-preview-d38.mjs
          node --check supabase/functions/odoo-invoice-evidence/core.mjs
          node --check supabase/functions/odoo-commission-pipeline/calculation.mjs
          node --check supabase/functions/odoo-commission-pipeline/unit-basis.mjs
          node --check supabase/functions/odoo-commission-pipeline/scope.mjs
          node --check validation-v12/assets/app-crm-d27.js
          node --check validation-v12/assets/monthly-odoo-fallback-d26.mjs
          node --check validation-v12/assets/monthly-commission-d25.mjs
          node --check validation-v12/assets/odoo-quote-pipeline-d25.mjs
          node --check validation-v12/assets/tasks-d24.mjs
          node --check validation-v12/assets/connectors-d24.mjs
          node --check validation-v12/assets/odoo-quote-pipeline-d24.mjs
          node --check validation-v12/assets/odoo-quote-pipeline-d23.mjs
          node --check validation-v12/assets/odoo-commission-model-d22.mjs
          node --check validation-v12/assets/manual-quotes-ui-d21.mjs
          node --check validation-v12/assets/quote-forecast-d21.mjs
          node --check validation-v12/assets/manual-quotes-ui-d20.mjs
          node --check validation-v12/assets/manual-quotes-d20.mjs
          node --check validation-v12/assets/order-line-commission-d20.mjs
          node --check validation-v12/assets/archives-d18.mjs
          node --check validation-v12/assets/strategy-d19.mjs
          node --check validation-v12/assets/strategy-model.mjs
          node --check validation-v12/assets/whatsapp-brief-model.mjs
      - run: npm install --no-save --no-package-lock playwright@1.56.1 @electric-sql/pglite@0.5.8
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/*.test.mjs supabase/functions/companion-tasks/core.test.mjs supabase/functions/apple-reminders-sync/core.test.mjs supabase/functions/_shared/*.test.mjs
      - run: node --test supabase/tests/google-connectors-sql.test.mjs
      - run: node --test supabase/tests/whatsapp-archive-coverage-sql.test.mjs
      - run: node --test supabase/tests/commission-returns-sql.test.mjs
      - run: node --test supabase/tests/client-samples-sql.test.mjs
        env:
          CONNECTOR_TEST_PGLITE_URL: '@electric-sql/pglite'
      - run: node --test supabase/tests/stock-watches-sql.test.mjs
      - run: node tests/strategy-preview-smoke.mjs
      - run: node tests/companion-v1-preview.mjs
      - run: node tests/commercial-ux-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-commercial-ux-visuals
          path: artifacts-ux/*.png
          retention-days: 2
      - run: node tests/stock-watches-mobile.mjs
      - run: node tests/development-preview-v2.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-v2-visuals
          path: artifacts-v2/*.png
          retention-days: 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-v1-visuals
          path: artifacts-v1/*.png
          retention-days: 2
      - run: node tests/tasks-preview-smoke.mjs
      - run: node tests/monthly-credits-preview-d38.mjs
      - run: node tests/commission-returns-preview-d37.mjs
      - run: node tests/tasks-preview-d36.mjs
      - run: node tests/commission-pipeline-smoke.mjs
      - run: node tests/monthly-commission-preview-d25.mjs
      - run: node tests/monthly-commission-fallback-preview-d26.mjs
      - run: node tests/monthly-commission-search-preview-d27.mjs
      - run: node tests/monthly-commission-preview-d28.mjs
      - run: node tests/commission-kino-mobile-d30.mjs
      - run: node tests/sources-preview-d35.mjs
