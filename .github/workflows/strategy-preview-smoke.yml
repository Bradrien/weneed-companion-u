name: Companion D20 mobile preview
on:
  push:
    branches: [main]
    paths:
      - 'validation-v12/**'
      - 'tests/strategy-preview-smoke.mjs'
      - '.github/workflows/strategy-preview-smoke.yml'
permissions:
  contents: read
jobs:
  strategy-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check preview module syntax
        run: |
          node --check validation-v12/assets/app-crm-d20.js
          node --check validation-v12/assets/manual-quotes-ui-d20.mjs
          node --check validation-v12/assets/manual-quotes-d20.mjs
          node --check validation-v12/assets/order-line-commission-d20.mjs
          node --check validation-v12/assets/archives-d18.mjs
          node --check validation-v12/assets/strategy-d19.mjs
          node --check validation-v12/assets/strategy-model.mjs
          node --check validation-v12/assets/whatsapp-brief-model.mjs
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/strategy-preview-smoke.mjs
