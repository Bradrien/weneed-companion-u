name: Kino Bridge Chromium integration
on:
  pull_request:
    paths: ['kino-bridge/**', 'tests/bridge-browser.mjs', '.github/workflows/bridge-browser.yml']
  push:
    branches: [main, 'codex/**']
    paths: ['kino-bridge/**', 'tests/bridge-browser.mjs', '.github/workflows/bridge-browser.yml']
permissions:
  contents: read
jobs:
  bridge-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:bridge-browser
